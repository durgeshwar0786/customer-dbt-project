
name: dbt CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
            - name: Validate Snowflake account identifier
        env:
          DBT_ACCOUNT: ${{ secrets.DBT_ACCOUNT }}
        run: |
          if [ -z "$DBT_ACCOUNT" ]; then
            echo "ERROR: DBT_ACCOUNT is empty"
            exit 1
          fi

          if [[ "$DBT_ACCOUNT" =~ [^a-zA-Z0-9_.-] ]]; then
            echo "ERROR: DBT_ACCOUNT contains invalid characters"
            exit 1
          fi

          echo "DBT_ACCOUNT format is valid"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt Snowflake
        run: |
          pip install dbt-snowflake==1.12.1

      - name: Create dbt profiles.yml
        env:
          DBT_ACCOUNT: ${{ secrets.DBT_ACCOUNT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_ROLE: ${{ secrets.DBT_ROLE }}
          DBT_WAREHOUSE: ${{ secrets.DBT_WAREHOUSE }}
          DBT_DATABASE: ${{ secrets.DBT_DATABASE }}
          DBT_SCHEMA: ${{ secrets.DBT_SCHEMA }}
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          customer_dbt_project:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "${DBT_ACCOUNT}"
                user: "${DBT_USER}"
                password: "${DBT_PASSWORD}"
                role: "${DBT_ROLE}"
                warehouse: "${DBT_WAREHOUSE}"
                database: "${DBT_DATABASE}"
                schema: "${DBT_SCHEMA}"
                threads: 4
          EOF

      - name: Check dbt connection
        run: dbt debug --target dev

      - name: Run dbt models and tests
        run: dbt build --target dev
